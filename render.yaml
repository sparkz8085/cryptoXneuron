services:
  - type: web
    name: customer-categorizer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_DB_URL
        sync: false
      - key: MODEL_TRUSTED
        value: "1"
      - key: APP_ENV
        value: production
      - key: SESSION_SECRET_KEY
        sync: false
      - key: TRAINING_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.8

